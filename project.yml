name: Benchd

options:
  bundleIdPrefix: com.anshmehta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Benchd:
    type: application
    platform: iOS
    sources:
      - path: Benchd
        excludes:
          # Docs and folder-keepers are for git, not for the app bundle.
          - "**/*.md"
          - "**/.gitkeep"
          # Referenced via INFOPLIST_FILE — must not also be a bundle resource.
          - "Resources/Info.plist"
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshmehta.benchd
        PRODUCT_NAME: Benchd
        INFOPLIST_FILE: Benchd/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  BenchdTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BenchdTests
    dependencies:
      - target: Benchd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anshmehta.benchd.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Benchd:
    build:
      targets:
        Benchd: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BenchdTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
